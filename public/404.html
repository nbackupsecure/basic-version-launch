<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhealth</title>
    <script>
      (function() {
        var p = (window.location.pathname || '').toLowerCase();
        var h = (window.location.hash || '').toLowerCase();
        var s = (window.location.search || '').toLowerCase();
        if (p.indexOf('command-center') !== -1 || h.indexOf('command-center') !== -1 || s.indexOf('command-center') !== -1) {
          window.location.replace('/#/command-center');
        } else {
          window.location.replace('/');
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/?p=/'" />
  </head>
  <body style="background-color: #0b192c; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="font-size: 14px; opacity: 0.8;">Redirecting to Nhealth...</p>
  </body>
</html>
